name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate de calidad estática: ruff detecta errores de estilo, imports y bugs
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ruff
        run: make lint

  # Gate de calidad funcional: tests + coverage con umbral mínimo 80%
  # Depende de lint: si el linter falla, no se ejecutan los tests
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: make test
      # Coverage: falla el pipeline si la cobertura baja de 80%
      # Umbral base F0; se incrementará a 85% para domain/application en F6
      - name: Run coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
