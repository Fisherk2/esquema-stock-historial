name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate 1: Lint — código limpio con ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ruff
        run: make lint

  # Gate 2: Typecheck — mypy --strict en todo el código fuente
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mypy
        run: make typecheck

  # Gate 3: Test — ejecutar suite completa
  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: make test

  # Gate 4: Coverage — umbral global + por capa (dominio criticos)
  # Un solo run de tests con verificaciones de coverage por paquete
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Un solo run genera el reporte completo
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=json

      # Verificacion de umbrales sin re-ejecutar tests
      - name: Coverage — global >=80%
        run: python -c "import json; d=json.load(open('coverage.json')); \
          pct=d['totals']['percent_covered_display']; \
          print(f'Global coverage: {pct}%'); \
          exit(0 if float(pct)>=80 else 1)"

      - name: Coverage — domain >=90%
        run: python -m coverage report --include="src/domain/*" --fail-under=90

      - name: Coverage — application >=85%
        run: python -m coverage report --include="src/application/*" --fail-under=85

  # Gate 5: Docker build — validar que el Dockerfile compila (push: false)
  docker-build:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build — validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stock-historial:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
