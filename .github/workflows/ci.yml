name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate 1: Lint — código limpio con ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ruff
        run: make lint

  # Gate 2: Typecheck — mypy --strict en todo el código fuente
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mypy
        run: make typecheck

  # Gate 3: Test — ejecutar suite completa
  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: make test

  # Gate 4: Coverage — 3 sub-gates (global, domain, application)
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Coverage — global ≥80%
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Coverage — domain ≥90%
        run: pytest --cov=src.domain --cov-report=term-missing --cov-fail-under=90

      - name: Coverage — application ≥85%
        run: pytest --cov=src.application --cov-report=term-missing --cov-fail-under=85

  # Gate 5: Docker build — validar que el Dockerfile compila (push: false)
  docker-build:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build — validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stock-historial:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
