[project]
name = "stock-historial"
version = "0.1.0"
description = "Sistema de gestión de inventario con Source of Truth Inmutable y stock histórico en <100ms"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "ruff==0.15.13",
    "black==26.3.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers==4.14.2",
    "freezegun==1.5.5",
    "pre-commit==4.6.0",
    "mypy==2.1.0",
    "hypothesis==6.141.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Categorías de reglas activas:
# E/W: pycodestyle (estilo PEP 8)
# F: pyflakes (errores lógicos)
# I: isort (orden de imports)
# N: pep8-naming (convenciones de nombres)
# UP: pyupgrade (sintaxis moderna Python)
# B: flake8-bugbear (bugs comunes)
# SIM: flake8-simplify (simplificación de código)
# TCH: flake8-type-checking (imports TYPE_CHECKING)
# RUF: reglas específicas de ruff
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports]
# Prohíbe imports relativos (ej: from ..domain import X).
# Enforcement de Clean Architecture: los imports entre capas deben ser
# absolutos para que la dirección de dependencias sea explícita.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Use case imports in adapters are used at runtime (type annotations + Annotated deps),
# so they cannot be moved to TYPE_CHECKING blocks despite TC001 suggesting it.
# asyncpg is also needed at runtime for FastAPI to resolve Annotated[type, Depends()]
# when `from __future__ import annotations` stringifies the annotations.
"src/adapters/api/dependencies.py" = ["TC001", "TC002"]
"src/adapters/api/routers/*.py" = ["TC001", "B008"]
# Integration API tests use httpx.AsyncClient as real type (needed by pytest fixtures).
"tests/integration/api/*.py" = ["TC002"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath permite que pytest resuelva imports como "from src.main import ..."
# sin necesidad de instalar el paquete en modo editable.
pythonpath = ["."]
# asyncio_mode="auto" detecta tests async automáticamente sin decorar con
# @pytest.mark.asyncio en cada uno.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v --tb=short --hypothesis-seed=0"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
# asyncpg no tiene py.typed markers — ignorar import-untyped
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# APScheduler no tiene py.typed markers
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: strict=false — mocks y fixtures dinámicas no se benefician
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["src"]
# branch=true mide cobertura de ramas (if/else), no solo de líneas.
# Detecta casos donde una línea se ejecuta pero una rama condicional no.
branch = true

[tool.coverage.report]
# fail_under=80: el pipeline de CI falla si la cobertura baja de 80%.
# Umbral base para F0; se incrementará a 85% para domain/application en F6.
fail_under = 80
show_missing = true
skip_empty = true
