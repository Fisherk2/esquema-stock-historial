services:
  # PostgreSQL 16 Alpine — imagen ligera para desarrollo local
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_historial
    ports:
      - "5432:5432"
    # pg_isready verifica que PostgreSQL acepta conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Volumen persistente para datos entre reinicios del contenedor
    volumes:
      - pgdata:/var/lib/postgresql/data

  # App FastAPI — se construye desde el Dockerfile del proyecto
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # DSN asyncpg: protocolo+driver://user:pass@host:port/dbname
      # "db" resuelve al servicio PostgreSQL dentro de la red Docker
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stock_historial
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: info
      ENVIRONMENT: development
    # Espera a que PostgreSQL esté healthy antes de iniciar la app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
